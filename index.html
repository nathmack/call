<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Call</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 18px/1.5 system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
  main { text-align: center; max-width: 340px; }
  p { margin: 0 0 20px; }
  a { display: block; padding: 18px 24px; border-radius: 16px; background: #2f4bd8; color: #fff; font-weight: 700; font-size: 20px; text-decoration: none; }
  a[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <p id="msg">Opening…</p>
  <a id="go" hidden></a>
</main>
<script>
  // Hands a phone number to the JustCall app or the phone's dialler.
  // The address ends in #j+61400111222 (JustCall) or #t+61400111222 (phone dialler).
  // The number sits after the #, so it stays on the phone and is never sent to this page's server.
  function run() {
    var m = /^#([jt])(\+\d{7,15})$/.exec(location.hash), msg = document.getElementById("msg"), go = document.getElementById("go");
    if (!m) { msg.textContent = "No phone number was passed to this page."; go.hidden = true; return; }
    var href = (m[1] === "j" ? "justcall://" : "tel:") + m[2];
    msg.textContent = m[2];
    go.href = href;
    go.textContent = m[1] === "j" ? "Call with JustCall" : "Call with Phone";
    go.hidden = false;
    location.href = href; // straight on; the button is there if the phone wants a tap first
  }
  run();
  // If the phone reuses this tab for the next call, pick up the new number instead of keeping the old one.
  window.addEventListener("hashchange", run);
</script>
</body>
</html>
